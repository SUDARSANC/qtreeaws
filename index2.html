<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Page</title>

    <!-- CSS Styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 100px;
            background: white;
            padding: 30px;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        }

        button {
            padding: 10px 20px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #007bff;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: orange;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>welcome</h1>
        <p>Click the button to see magic ✨</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </div>

    <!-- JavaScript -->
    <script>
        function showMessage() {
            document.getElementById("message").innerText = "Hello Sudarsan! 🎉";
        }
    </script>

</body>
</html>
